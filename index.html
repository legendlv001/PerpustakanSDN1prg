<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERPUS SDN 1 PARIGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
        h1, h2, h3 { font-family: 'Fredoka One', cursive; }
        .page-content { display: none; }
        .active-page { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Notifikasi Modal Kustom -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <h3 id="modal-title" class="text-xl mb-2 text-emerald-800">Informasi</h3>
            <p id="modal-message" class="text-gray-600 mb-4">Pesan...</p>
            <button onclick="closeModal()" class="bg-emerald-600 text-white w-full py-2 rounded-lg hover:bg-emerald-700 transition">OK</button>
        </div>
    </div>

    <!-- Modal Login Admin -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">
            <h3 class="text-xl mb-2 text-emerald-800">🔐 Login Admin</h3>
            <form onsubmit="handleAdminLogin(event)">
                <input type="password" id="admin-password-input" placeholder="Masukkan kata sandi" class="w-full px-3 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
                <div class="flex space-x-2">
                    <button type="button" onclick="closeLoginModal()" class="bg-gray-300 w-1/2 py-2 rounded-lg">Batal</button>
                    <button type="submit" class="bg-emerald-600 text-white w-1/2 py-2 rounded-lg">Masuk</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scanner & Form Modals -->
    <div id="scanner-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-md text-center shadow-2xl">
            <h3 class="text-xl mb-4 text-emerald-800">📷 Scan QR</h3>
            <div id="reader" class="w-full overflow-hidden rounded-xl border mb-4"></div>
            <button onclick="closeScannerModal()" class="bg-rose-600 text-white w-full py-2 rounded-lg">Tutup</button>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="bg-emerald-600 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl">📚 PERPUS SDN 1 PARIGI</h1>
            <div id="nav-buttons" class="flex gap-2">
                <button onclick="showPage('dashboard')">🏠</button>
                <button onclick="showPage('murid')">👨‍🎓</button>
                <button onclick="showPage('absen')">📋</button>
                <button onclick="showPage('transaksi')">📖</button>
                <button onclick="openLoginModal()" id="btn-login-admin" class="bg-amber-500 px-3 py-1 rounded text-sm">Login</button>
                <button onclick="logoutAdmin()" id="btn-logout-admin" class="hidden bg-rose-600 px-3 py-1 rounded text-sm">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8">
        <div id="page-dashboard" class="page-content active-page">
            <h2 class="text-3xl text-emerald-800 mb-6">Selamat Datang!</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-purple-500 text-white p-6 rounded-2xl"><h3>👥 Murid</h3><p id="stat-murid">0</p></div>
                <div class="bg-blue-500 text-white p-6 rounded-2xl"><h3>📊 Absen</h3><p id="stat-absen">0</p></div>
                <div class="bg-orange-500 text-white p-6 rounded-2xl"><h3>📖 Pinjam</h3><p id="stat-pinjam">0</p></div>
            </div>
        </div>

        <div id="page-murid" class="page-content">
            <h2 class="text-2xl text-emerald-800 mb-4">Data Murid</h2>
            <div id="table-murid-container">Memuat...</div>
        </div>

        <div id="page-absen" class="page-content">
            <div class="flex justify-between mb-4">
                <h2 class="text-2xl text-emerald-800">📋 Absen</h2>
                <button onclick="tambahAbsenManual()" id="btn-tambah-absen" class="hidden bg-emerald-600 text-white px-3 py-1 rounded">➕ Tambah</button>
            </div>
            <div id="table-absen-container">Memuat...</div>
        </div>

        <div id="page-transaksi" class="page-content">
            <div class="flex justify-between mb-4">
                <h2 class="text-2xl text-emerald-800">📖 Peminjaman</h2>
                <button onclick="tambahTransaksiManual()" id="btn-tambah-transaksi" class="hidden bg-emerald-600 text-white px-3 py-1 rounded">➕ Tambah</button>
            </div>
            <div id="table-transaksi-container">Memuat...</div>
        </div>
    </main>

    <script>
        const SPREADSHEET_ID = "1RFxZ6uY1CrDSxKd6GeMLSOD7QwZBd66jqZsvxfnkbXk";
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5La8fM9DivJxqMJZvd_FmgEB8ez83qTC7KtqIpk6DH0bdL7B8ne6U9_CoLu57_sQ28Q/exec";
        
        let appData = { murid: [], absensi: [], transaksi: [] };
        let isAdminLoggedIn = localStorage.getItem('perpus_admin_logged') === 'true';

        window.onload = () => { updateAdminUI(); loadAllData(); };

        function updateAdminUI() {
            const isAdm = localStorage.getItem('perpus_admin_logged') === 'true';
            document.getElementById('btn-tambah-absen').classList.toggle('hidden', !isAdm);
            document.getElementById('btn-tambah-transaksi').classList.toggle('hidden', !isAdm);
            document.getElementById('btn-login-admin').classList.toggle('hidden', isAdm);
            document.getElementById('btn-logout-admin').classList.toggle('hidden', !isAdm);
        }

        async function fetchSheetCSV(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;
            const res = await fetch(url);
            const text = await res.text();
            return text.split('\n').slice(1).map(row => {
                const cols = row.split(',').map(c => c.replace(/"/g, ''));
                return { col1: cols[0], col2: cols[1], col3: cols[2] };
            });
        }

        async function loadAllData() {
            appData.murid = await fetchSheetCSV('murid');
            appData.absensi = await fetchSheetCSV('absen');
            appData.transaksi = await fetchSheetCSV('pinjam');
            render();
        }

        function render() {
            document.getElementById('stat-murid').innerText = appData.murid.length;
            document.getElementById('stat-absen').innerText = appData.absensi.length;
            document.getElementById('stat-pinjam').innerText = appData.transaksi.length;
            
            document.getElementById('table-absen-container').innerHTML = `<table class="w-full">${appData.absensi.map(a => `<tr><td>${a.col1}</td><td>${a.col2}</td><td>${a.col3}</td></tr>`).join('')}</table>`;
            document.getElementById('table-transaksi-container').innerHTML = `<table class="w-full">${appData.transaksi.map(t => `<tr><td>${t.col1}</td><td>${t.col2}</td><td>${t.col3}</td></tr>`).join('')}</table>`;
        }

        function tambahAbsenManual() {
            const nama = prompt("Nama:");
            const nis = prompt("NIS:");
            if (!nama || !nis) return;
            showModal("Proses", "Mengirim...");
            fetch(`${SCRIPT_URL}?sheetName=absen`, { method: 'POST', mode: 'no-cors', body: JSON.stringify([nama, nis, new Date().toLocaleString()]) })
                .then(() => { loadAllData(); closeModal(); alert("Berhasil!"); });
        }

        function tambahTransaksiManual() {
            const nama = prompt("Nama:");
            const buku = prompt("Judul Buku:");
            if (!nama || !buku) return;
            showModal("Proses", "Mengirim...");
            fetch(`${SCRIPT_URL}?sheetName=pinjam`, { method: 'POST', mode: 'no-cors', body: JSON.stringify([nama, buku, new Date().toLocaleDateString()]) })
                .then(() => { loadAllData(); closeModal(); alert("Berhasil!"); });
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            if (document.getElementById('admin-password-input').value === '123') {
                localStorage.setItem('perpus_admin_logged', 'true');
                closeLoginModal(); updateAdminUI();
            } else alert("Password Salah!");
        }

        function logoutAdmin() { localStorage.removeItem('perpus_admin_logged'); updateAdminUI(); }
        function showPage(id) { document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active-page')); document.getElementById('page-' + id).classList.add('active-page'); }
        function showModal(t, m) { document.getElementById('custom-modal').classList.remove('hidden'); document.getElementById('modal-title').innerText = t; document.getElementById('modal-message').innerText = m; }
        function closeModal() { document.getElementById('custom-modal').classList.add('hidden'); }
        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }
    </script>
</body>
</html>
